services:
  xrouter-webhook-proxy:
    container_name: ${PROJECT_NAME}
    image: cr.yandex/${REGISTRY_ID}/${PROJECT_NAME}:latest
    platform: linux/amd64
    ports:
      - "${PORT:-8220}:${PORT:-8220}"
    env_file:
      - ./.env
    command: >
      uvicorn src.main:get_app --host 0.0.0.0 --port ${PORT:-8220} --reload --factory
    restart: unless-stopped
    networks:
      - xrouter-net

networks:
  xrouter-net:
    external: true
    name: xrouter-net
