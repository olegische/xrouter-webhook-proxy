# HTTP server for SSL domains (redirect to HTTPS)
server {
    listen 80;
    server_name xrouterchat.com rorotools.com;

    return 301 https://$host$request_uri;
}

# HTTPS server for xrouterchat.com
server {
    listen 443 ssl http2;
    server_name xrouterchat.com;

    ssl_certificate /etc/ssl/certs/xrouterchat.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/keys/xrouterchat.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # Root location
    location / {
        proxy_pass http://xrouter-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # Next.js static files
    location /_next/static {
        proxy_pass http://xrouter-web:3000;
        proxy_set_header Host $host;

        # Cache static files
        expires 365d;
        add_header Cache-Control "public, no-transform";
    }

    # Static files in public directory
    location /static {
        proxy_pass http://xrouter-web:3000;
        proxy_set_header Host $host;

        # Cache static files
        expires 365d;
        add_header Cache-Control "public, no-transform";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block access to sensitive files
    location ~ (\.env|credentials|client_secrets\.json) {
        deny all;
        return 404;
    }

    # API routes (webhook endpoints)
    location /webhook/ {
        proxy_pass http://xrouter-webhook-proxy:8220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;

        # Webhook-specific settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Allow larger request bodies for webhook payloads
        client_max_body_size 10M;
    }

    # API documentation
    location /docs {
        proxy_pass http://xrouter-webhook-proxy:8220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI schema
    location /openapi.json {
        proxy_pass http://xrouter-webhook-proxy:8220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }

    # API v1 message endpoint
    location /api/v1/message {
        proxy_pass http://98.158.100.12:8990;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Allow larger request bodies for payloads
        client_max_body_size 10M;
    }
}

